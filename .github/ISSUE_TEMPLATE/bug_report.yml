name: Bug report
description: Something doesn't work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `./mvnw spring-boot:run`
        2. Open ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, or the commit SHA you ran.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove tokens and other secrets first.
      render: text
