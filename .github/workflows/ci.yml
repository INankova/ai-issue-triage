# Builds and tests every pull request and every push to main (ROADMAP P0.15).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the code; it never writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven # caches ~/.m2/repository between runs, keyed on pom.xml

      # Compile, run the tests (Testcontainers uses the runner's Docker), write the JaCoCo report
      # and run the Spotless format check. No real LLM or GitHub calls happen here.
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify
