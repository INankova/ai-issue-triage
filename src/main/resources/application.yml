spring:
  application:
    name: ai-issue-triage
  http:
    clients:
      # Without a read timeout a stuck request would hang forever instead of failing and being retried (P1.3).
      connect-timeout: 10s
      read-timeout: 30s
  jpa:
    # Don't keep a database session open while rendering views; load what a view needs in the service layer.
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks at startup that the entities match it, and fails fast if not.
      ddl-auto: validate

triage:
  github:
    # Read-only token from the GITHUB_TOKEN environment variable (P0.8). Unset means unauthenticated: 60 requests/hour.
    token: ${GITHUB_TOKEN:}

management:
  endpoint:
    health:
      # Show each component's status (db, diskSpace, ...) but not details such as the database version.
      show-components: always
